<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Struk Pertamina</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #eeeeee;
      font-family: Arial, sans-serif;
      color: #222;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 18px;
      background: #087a43;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary { background: #555; }
    .receipt {
      width: 80mm;
      max-width: 100%;
      margin: 0 auto;
      padding: 8mm 6mm;
      background: white;
      box-shadow: 0 2px 12px #0002;
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 1.35;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 22px;
      font-family: Arial, sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -1px;
    }
    .logo {
      position: relative;
      width: 38px;
      height: 32px;
    }
    .logo span {
      position: absolute;
      display: block;
      background: #111;
      transform: skew(-28deg);
    }
    .logo .one { width: 13px; height: 27px; left: 2px; top: 5px; }
    .logo .two { width: 17px; height: 11px; left: 17px; top: 13px; }
    .logo .three { width: 13px; height: 10px; left: 23px; top: 0; }
    .center { text-align: center; }
    .station-code {
      font-size: 16px;
      margin-bottom: 2px;
    }
    .station-info { line-height: 1.3; }
    .meta {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 12px;
      margin-top: 25px;
      line-height: 1.5;
    }
    .rule {
      border-top: 1px dashed #888;
      margin: 10px 0;
    }
    .details {
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 8px;
      line-height: 1.55;
    }
    .details .value { text-align: left; }
    .money {
      display: grid;
      grid-template-columns: 1fr auto;
      margin-top: 14px;
      line-height: 2.1;
    }
    .money .amount { text-align: right; }
    @page { size: 80mm auto; margin: 0; }
    @media print {
      body { padding: 0; margin: 0; background: white; }
      .actions { display: none !important; }
      .receipt {
        width: 80mm;
        max-width: none;
        margin: 0;
        padding: 5mm 5mm;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button onclick="window.print()">Cetak Struk</button>
    <button class="secondary" onclick="window.location.reload()">Reset</button>
  </div>

  <main class="receipt">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <span class="one"></span><span class="two"></span><span class="three"></span>
      </div>
      <span>PERTAMINA</span>
    </div>

    <div class="center">
      <div class="station-code">31.122.04</div>
      <div class="station-info">
        SPBU Pondok Indah<br>
        Jl. Sultan Iskandar Muda<br>
        085695741259
      </div>
    </div>

    <section class="meta">
      <div>Shift : 1</div>
      <div>No. Trans : 2178468</div>
      <div style="grid-column: 1 / -1;">Waktu : 10/11/2026 07:35:54</div>
    </section>

    <div class="rule"></div>

    <section class="details">
      <div>Pulau/Pompa</div><div class="value">: 1</div>
      <div>Nama Produk</div><div class="value">: PERTAMAX_TURBO</div>
      <div>Harga/Liter</div><div class="value">: Rp. 19,600</div>
      <div>Volume (L)</div><div class="value">: 35.722</div>
      <div>Total Harga</div><div class="value">: Rp. 700,150</div>
      <div>Operator</div><div class="value">: AMANDA</div>
    </section>

  </main>
</body>
</html>
